name: linux-appimage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  appimage:
    # Oldest hosted runner: the AppImage then runs on any distro with a newer glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make pkg-config libglib2.0-dev libudev-dev
      - name: Unit tests
        run: make test
      - name: Build AppImage
        run: ./packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WirelessBattery-AppImage
          path: WirelessBattery-*.AppImage
