name: build-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    # ubuntu-22.04 provides an older glibc baseline so packages run on most distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make pkg-config libglib2.0-dev libudev-dev rpm

      - name: Run unit tests
        run: make test

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+.*) ]]; then
            echo "VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build AppImage
        run: ./packaging/build-appimage.sh

      - name: Build Debian package (.deb)
        run: ./packaging/build-deb.sh "${{ steps.version.outputs.VERSION }}"

      - name: Build RPM package (.rpm)
        run: ./packaging/build-rpm.sh "${{ steps.version.outputs.VERSION }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnDeck-Juice-packages
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OnDeck-Juice-packages
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
